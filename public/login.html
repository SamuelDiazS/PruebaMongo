<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="" />
    <title>EduPets - Login</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <h1>Inicia sesión</h1>
      <form id="login-form" class="auth-form">
        <label>
          Nombre de usuario
          <input type="text" name="username" placeholder="Escribe tu usuario" required />
        </label>
        <label>
          Contraseña
          <input type="password" name="password" placeholder="••••••••" required />
        </label>
        <button type="submit" class="button button--primary">Entrar</button>
      </form>
      <p class="auth-link">¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
      <p id="login-message" class="message" aria-live="polite"></p>
    </main>

    <script src="js/auth.js"></script>
  </body>
</html>
